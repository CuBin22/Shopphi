{% load shop_extras %}
<article class="card">
  <a class="card__product-link" href="{{ p.get_absolute_url }}{% if nguon %}?nguon={{ nguon }}{% endif %}" aria-label="Xem {{ p.name }}">
  <div class="tile tone-{{ p.pk|tone }}">
    {% if p.image %}<img class="tile__image" src="{{ p.image.url }}" alt="{{ p.name }}" loading="lazy">{% else %}{% include "catalog/_glyph.html" with slug=p.category.slug %}{% endif %}
    {% if p.stock == 0 %}<span class="tag tag--out">Hết hàng</span>{% endif %}
  </div>
  </a>
  <div class="card__body">
    <a class="card__title" href="{{ p.get_absolute_url }}{% if nguon %}?nguon={{ nguon }}{% endif %}"><h3>{{ p.name }}</h3></a>
    <p class="shop"><a href="{% url 'shop_detail' p.shop_id %}">{% icon "store" %}{{ p.shop.name }}</a></p>
    <p class="price">{{ p.price|vnd }}</p>
  </div>
</article>
