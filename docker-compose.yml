services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-shopphi}
      POSTGRES_USER: ${DB_USER:-shopphi}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-shopphi-docker-local}
    volumes:
      - postgres_data_v18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-shopphi} -d ${DB_NAME:-shopphi}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    env_file:
      - .env
    environment:
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-docker-local-shopphi-key-change-before-deploying}
      DB_NAME: ${DB_NAME:-shopphi}
      DB_USER: ${DB_USER:-shopphi}
      DB_PASSWORD: ${DB_PASSWORD:-shopphi-docker-local}
      DB_HOST: db
      DB_PORT: "5432"
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - ./media:/app/media
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data_v18:
